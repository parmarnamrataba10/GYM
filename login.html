
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fit-First | Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <i class="fa-solid fa-dumbbell logo"></i>

        <h1>FIT-FIRST</h1>

        <h3>Welcome Back!</h3>

        <p>

            Login to access your member dashboard
            and manage your fitness journey.

        </p>

    </div>

    <!-- Right Side -->

    <div class="right">

        <form id="loginForm">

            <h2>Member Login</h2>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required>

            </div>

            <button type="submit">

                Login

            </button>

            <p class="register">

                Don't have an account?

                <a href="register.html">

                    Register Here

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
