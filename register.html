
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fit-First | Register</title>

    <link rel="stylesheet" href="register.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left">

        <i class="fa-solid fa-dumbbell logo"></i>

        <h1>FIT-FIRST</h1>

        <h3>Start Your Fitness Journey</h3>

        <p>
            Join the Fit-First family and become a stronger,
            healthier, and more confident version of yourself.
        </p>

    </div>

    <!-- Right Side -->

    <div class="right">

        <form id="registerForm">

            <h2>Member Registration</h2>

            <!-- Full Name -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Full Name"
                required>

            </div>

            <!-- Email -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                id="email"
                name="email"
                placeholder="Email Address"
                required>

            </div>

            <!-- Phone -->

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Phone Number"
                required>

            </div>

            <!-- Age + Gender -->

            <div class="row">

                <div class="input-box">

                    <i class="fa-solid fa-cake-candles"></i>

                    <input
                    type="number"
                    id="age"
                    name="age"
                    placeholder="Age"
                    required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-venus-mars"></i>

                    <select
                    id="gender"
                    name="gender"
                    required>

                        <option value="">Select Gender</option>

                        <option>Male</option>

                        <option>Female</option>

                        <option>Other</option>

                    </select>

                </div>

            </div>

            <!-- Height + Weight -->

            <div class="row">

                <div class="input-box">

                    <i class="fa-solid fa-ruler"></i>

                    <input
                    type="number"
                    id="height"
                    name="height"
                    placeholder="Height (cm)"
                    required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-weight-scale"></i>

                    <input
                    type="number"
                    id="weight"
                    name="weight"
                    placeholder="Weight (kg)"
                    required>

                </div>

            </div>

            <!-- Membership -->

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <select
                id="plan"
                name="plan"
                required>

                    <option value="">Select Membership</option>

                    <option>Basic</option>

                    <option>Standard</option>

                    <option>Premium</option>

                </select>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required>

            </div>

            <!-- Confirm Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm Password"
                required>

            </div>

            <button type="submit">

                Register

            </button>

            <p class="login">

                Already have an account?

                <a href="login.html">

                    Login Here

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/register.js"></script>

</body>

</html>
