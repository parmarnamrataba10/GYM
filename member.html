
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fit-First | Member Dashboard</title>

    <link rel="stylesheet" href="member.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

    <h1>
        <i class="fa-solid fa-dumbbell"></i>
        Fit-First
    </h1>

    <button id="logoutBtn">
        Logout
    </button>

</header>

<div class="container">

    <h2>Member Dashboard</h2>

    <div class="card">

        <p><strong>Member ID :</strong> <span id="memberId"></span></p>

        <p><strong>Full Name :</strong> <span id="fullName"></span></p>

        <p><strong>Email :</strong> <span id="email"></span></p>

        <p><strong>Phone :</strong> <span id="phone"></span></p>

        <p><strong>Age :</strong> <span id="age"></span></p>

        <p><strong>Gender :</strong> <span id="gender"></span></p>

        <p><strong>Height :</strong> <span id="height"></span> cm</p>

        <p><strong>Weight :</strong> <span id="weight"></span> kg</p>

        <p><strong>Membership :</strong> <span id="plan"></span></p>

        <p><strong>Join Date :</strong> <span id="joinDate"></span></p>

    </div>

</div>

<script src="js/member.js"></script>

</body>

</html>
